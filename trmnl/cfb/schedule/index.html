<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>College Football Schedule</title>
    <link rel="preconnect" href="https://site.api.espn.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="board" aria-live="polite">
      <header class="masthead">
        <div class="brand">
          <img class="team-logo" id="team-logo" alt="" hidden />
          <div>
            <p class="eyebrow" id="team-name">COLLEGE FOOTBALL</p>
            <h1>Football <span>Schedule</span></h1>
          </div>
        </div>
        <div class="season-lockup">
          <strong id="season"></strong>
          <span>SEASON</span>
        </div>
      </header>

      <section class="hero" id="next-game">
        <div class="hero-label">NEXT GAME</div>
        <div class="hero-content">
          <div class="date-block"><span id="next-month"></span><b id="next-day"></b><small id="next-weekday"></small></div>
          <div class="matchup">
            <p id="next-context"></p>
            <h2 id="next-opponent"></h2>
            <div id="next-details"></div>
          </div>
          <div class="countdown"><strong id="count-number">—</strong><span id="count-label">DAYS AWAY</span></div>
        </div>
      </section>

      <section class="schedule" id="schedule" aria-label="College football schedule">
        <div class="schedule-heading">
          <span>FULL SCHEDULE</span>
          <span id="record">SCHEDULE LOADING</span>
        </div>
        <div class="games" id="games"></div>
      </section>

      <footer>
        <span id="team-rally">COLLEGE FOOTBALL</span>
        <span class="rule"></span>
        <span id="updated">ESPN SCHEDULE DATA</span>
      </footer>
    </main>
    <script src="app.js" data-team-id="24"></script>
  </body>
</html>
